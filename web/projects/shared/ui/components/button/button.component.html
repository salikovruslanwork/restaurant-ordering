<ng-template #content>
  <span class="button__content">
    @if (loading()) {
      <app-spinner [size]="iconSize()" />
    } @else if (icon(); as iconName) {
      <app-icon [name]="iconName" [size]="iconSize()" />
    }
    <ng-content />
  </span>
</ng-template>

@switch (variant()) {
  @case (ButtonVariant.Icon) {
    <button
      matIconButton
      [attr.aria-busy]="loading() || null"
      [attr.aria-expanded]="ariaExpanded()"
      [attr.aria-label]="ariaLabel()"
      [class]="classes()"
      [disabled]="disabled() || loading()"
      [type]="type()"
    >
      <ng-container [ngTemplateOutlet]="content" />
    </button>
  }
  @case (ButtonVariant.Fab) {
    <button
      matFab
      [attr.aria-busy]="loading() || null"
      [attr.aria-expanded]="ariaExpanded()"
      [attr.aria-label]="ariaLabel()"
      [class]="classes()"
      [disabled]="disabled() || loading()"
      [type]="type()"
    >
      <ng-container [ngTemplateOutlet]="content" />
    </button>
  }
  @default {
    @if (link(); as url) {
      <a
        [attr.aria-label]="ariaLabel()"
        [class.button--block]="block()"
        [class]="classes()"
        [matButton]="appearance()"
        [routerLink]="url"
      >
        <ng-container [ngTemplateOutlet]="content" />
      </a>
    } @else {
      <button
        [attr.aria-busy]="loading() || null"
        [attr.aria-expanded]="ariaExpanded()"
        [attr.aria-label]="ariaLabel()"
        [class.button--block]="block()"
        [class.button--busy]="loading()"
        [class]="classes()"
        [disabled]="disabled() || loading()"
        [matButton]="appearance()"
        [type]="type()"
      >
        <ng-container [ngTemplateOutlet]="content" />
      </button>
    }
  }
}
