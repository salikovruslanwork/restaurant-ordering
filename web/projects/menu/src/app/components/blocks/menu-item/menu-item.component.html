@let dish = item();
<article class="menu-item" [class.menu-item--unavailable]="!dish.isAvailable">
  <div class="menu-item__media">
    <app-dish-image [muted]="!dish.isAvailable" [name]="dish.name" />
    @if (!dish.isAvailable) {
      <span class="menu-item__badge">Unavailable</span>
    }
  </div>
  <div class="menu-item__body">
    <h2 class="menu-item__name" [title]="dish.name">{{ dish.name }}</h2>
    <p class="menu-item__description">{{ dish.description }}</p>
    <div class="menu-item__footer">
      @if (dish.pricing.kind === PricingKind.Fixed) {
        <app-money [amount]="dish.pricing.price" [previousAmount]="previousPrice()" />
      } @else {
        <app-money [variant]="MoneyVariant.Open" />
      }
      @if (!dish.isAvailable) {
        <app-button disabled icon="add" [ariaLabel]="'Add ' + dish.name + ' — unavailable'"
          >Add</app-button
        >
      } @else if (dish.pricing.kind === PricingKind.Open) {
        <app-button
          icon="add"
          [ariaLabel]="'Add ' + dish.name + ' — set your price'"
          [variant]="ButtonVariant.Tonal"
          (click)="openPriceRequested.emit()"
          >Add</app-button
        >
      } @else if (quantity() > 0) {
        <app-quantity-stepper
          [name]="dish.name"
          [value]="quantity()"
          (changed)="quantityChanged.emit($event)"
        />
      } @else {
        <app-button icon="add" [ariaLabel]="'Add ' + dish.name" (click)="added.emit()"
          >Add</app-button
        >
      }
    </div>
  </div>
</article>
